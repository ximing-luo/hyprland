[Metadata]
Name=Hyprland-Blue
Version=1.0
Author=Custom
Description=Hyprland-style blue sci-fi theme with rounded corners
ScaleWithDPI=False

[InputPanel]
EnableBlur=False
# 普通候选字颜色 (白色)
NormalColor=#ffffff
# 选中候选字颜色 (淡青绿色)
HighlightCandidateColor=#99ffcc
# 高亮前景颜色 (浅橙色)
HighlightColor=#ffcc99
# 高亮背景颜色 (透明)
HighlightBackgroundColor=#00000000
# 候选字间距
Spacing=3
# 字体 (现代无衬线)
Font="Sans 12"
# 圆角半径
BorderRadius=20

[InputPanel/ShadowMargin]
Left=12
Right=12
Top=12
Bottom=12

[InputPanel/BlurMargin]
Left=12
Right=12
Top=12
Bottom=12

[InputPanel/ContentMargin]
Left=12
Right=12
Top=12
Bottom=12

[InputPanel/TextMargin]
Left=12
Right=12
Top=6
Bottom=6

[InputPanel/Background]
Image=panel.png
# 背景颜色叠加 (深蓝黑半透明)
OverlayColor=#0a0a1ae0
# 边框颜色 (霓虹蓝)
BorderColor=#0066cc
# 边框宽度
BorderWidth=1
# 边框圆角
BorderRadius=20

[InputPanel/Background/Margin]
Left=12
Right=12
Top=12
Bottom=12

[InputPanel/Highlight]
Color=#00000000
# 边框颜色 (浅橙色)
BorderColor=#ffcc99
# 边框宽度
BorderWidth=2
# 高亮区域圆角
BorderRadius=16

[InputPanel/Highlight/Margin]
Left=18
Right=18
Top=8
Bottom=8

[InputPanel/PrevPage]
Image=back.png

[InputPanel/PrevPage/ClickMargin]
Left=0
Right=0
Top=0
Bottom=0

[InputPanel/NextPage]
Image=next.png

[InputPanel/NextPage/ClickMargin]
Left=0
Right=0
Top=0
Bottom=0

[Menu]
Font="Sans 11"
NormalColor=#ffffff
HighlightColor=#99ffcc
Spacing=3

[Menu/Background]
Color=#0a0a1ae0
BorderColor=#0066cc
BorderWidth=1
BorderRadius=20

[Menu/Background/Margin]
Left=8
Right=8
Top=8
Bottom=8

[Menu/ContentMargin]
Left=8
Right=8
Top=8
Bottom=8

[Menu/Highlight]
Color=#0066cc30
BorderRadius=16

[Menu/Highlight/Margin]
Left=12
Right=12
Top=6
Bottom=6

[Menu/Separator]
Color=#0066cc60

[Menu/CheckBox]
Image=radio.png

[Menu/SubMenu]
Image=arrow.png

[Menu/TextMargin]
Left=8
Right=8
Top=8
Bottom=8