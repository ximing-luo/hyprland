# BEGIN_KITTY_THEME
# Rosé Pine
include kitty-theme.conf
# END_KITTY_THEME
window_padding_width 7
font_size 12
confirm_os_window_close 0

background_opacity 0.7

# Codex composer/user-message background (#191a24 blended with 12% white).
transparent_background_colors #34353e@0.7

scrollback_lines 20000

# 右键粘贴系统剪贴板内容
mouse_map right press ungrabbed paste_from_clipboard
